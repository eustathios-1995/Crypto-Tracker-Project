<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Stathis Gecko</title>
</head>
<body>
    <h1>Stathis Market</h1>
    <div id="gainers-losers-container">
        <div id="topGainers">Top 3 Gainers
            <table>
                <thead>
                    <tr>
                        <th>CryptoCurrency</th>
                        <th>24h Change</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="gainersList"></tbody>
            </table>
        </div>
        <div id="topLosers">Top 3 Losers
            <table>
                <thead>
                    <tr>
                        <th>CryptoCurrency</th>
                        <th>24h Change</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="losersList"></tbody>
            </table>
        </div>
    </div>
        <div class="main-layout">
            <div class="table-section">
                <table id="maintable">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>CryptoCurrency</th>
                            <th>Price</th>
                            <th>Volume</th>
                            <th>24h Change</th>
                            <th>Market Cap</th>
                            <th>Last 7 Days</th>
                        </tr>
                    </thead>
                    <tbody id="coinList"></tbody>
                </table>
            </div>
            <div id="chartSection" style="display:none;">
                <h2 id="chartTitle"></h2>
                <button id="closeChart">Hide Chart</button>
                <div id="tradingview_chart"></div>
                
            </div>
        </div>
    </div>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="scriptDay7.js"></script>
</body>
</html>
